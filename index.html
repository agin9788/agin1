<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>游戏工具合集</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(145deg, #0b1120 0%, #0a0f1a 100%);
            min-height: 100vh;
            padding: 20px 12px;
            overflow-x: hidden;
            position: relative;
        }

        /* 机械氛围网格纹理 */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                repeating-linear-gradient(0deg, rgba(59,130,246,0.03) 0px, rgba(59,130,246,0.03) 1px, transparent 1px, transparent 5px),
                repeating-linear-gradient(90deg, rgba(139,92,246,0.03) 0px, rgba(139,92,246,0.03) 1px, transparent 1px, transparent 5px);
            pointer-events: none;
        }

        .container {
            max-width: 580px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        /* ===== 主标题区域 - 彩虹渐变，字体适中 ===== */
        .header {
            text-align: center;
            margin-bottom: 22px;
            cursor: pointer;
            transition: transform 0.1s cubic-bezier(0.2, 1.2, 0.8, 1);
        }
        .header:active {
            transform: scale(0.98);
        }

        .title-container {
            position: relative;
            display: inline-block;
            margin-bottom: 8px;
        }

        /* 主标题 - 字体缩小到合适大小 26px */
        .header h1 {
            font-size: 26px;
            font-weight: 900;
            background: linear-gradient(135deg, 
                #FF3366, #FF6B3D, #FFB347, #FFD700, 
                #33CC99, #3399FF, #9933FF, #FF3366);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 1.2px;
            display: inline-block;
            padding: 0 8px;
            position: relative;
            z-index: 3;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
            animation: rainbowShift 5s ease infinite, titleFloat 2.5s ease-in-out infinite;
            filter: drop-shadow(0 0 2px rgba(0,255,255,0.2));
        }
        
        @keyframes rainbowShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        @keyframes titleFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-2px); }
        }

        /* 机械光晕 - 缩小范围 */
        .title-container::before {
            content: "";
            position: absolute;
            inset: -8px;
            border-radius: 50px;
            background: linear-gradient(120deg, #ff3366, #ffb347, #33cc99, #3399ff);
            filter: blur(14px);
            opacity: 0.35;
            z-index: 0;
            animation: borderGlow 3s linear infinite;
        }
        
        @keyframes borderGlow {
            0% { transform: rotate(0deg) scale(0.98); opacity: 0.3;}
            50% { opacity: 0.6; }
            100% { transform: rotate(360deg) scale(1); opacity: 0.3;}
        }

        /* 副标题 - 字体缩小 */
        .header p {
            font-size: 12px;
            font-weight: 600;
            background: rgba(10, 20, 35, 0.85);
            backdrop-filter: blur(8px);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 5px 18px;
            border-radius: 40px;
            border: 1px solid rgba(255, 215, 0, 0.5);
            transition: all 0.2s;
            color: #e2e8ff;
            letter-spacing: 0.6px;
            font-family: monospace;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.1), 0 3px 8px rgba(0,0,0,0.3);
        }
        
        .header p:hover {
            background: rgba(59, 130, 246, 0.4);
            border-color: #f0b34b;
            transform: translateY(-1px);
        }

        /* 选项卡 — 机械按键风格，字体缩小 */
        .tab-group {
            display: flex;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(12px);
            border-radius: 50px;
            padding: 5px;
            gap: 8px;
            margin-bottom: 24px;
            border: 1px solid rgba(255, 180, 60, 0.4);
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255,255,255,0.05);
        }
        .tab {
            flex: 1;
            text-align: center;
            padding: 8px 0;
            border-radius: 36px;
            font-size: 13px;
            font-weight: 700;
            color: #cbd5e6;
            cursor: pointer;
            transition: all 0.1s linear;
            background: rgba(20, 30, 50, 0.7);
            letter-spacing: 0.3px;
            font-family: monospace;
            backdrop-filter: blur(4px);
            box-shadow: inset 0 1px 1px rgba(0,0,0,0.3), 0 2px 2px rgba(0,0,0,0.2);
            border-bottom: 2px solid rgba(255, 100, 0, 0);
        }
        .tab:hover {
            background: rgba(80, 100, 150, 0.8);
            transform: translateY(-1px);
            border-bottom: 2px solid #ffaa33;
        }
        .tab.active {
            background: linear-gradient(135deg, #2c3e66, #1f2a48);
            color: #ffdd99;
            box-shadow: 0 0 8px rgba(255,200,100,0.6), inset 0 1px 0 rgba(255,255,200,0.3);
            border-bottom: 2px solid #ffaa33;
            text-shadow: 0 0 2px gold;
            font-size: 13px;
        }
        .tab:active {
            transform: scale(0.97);
        }

        /* 卡片网格 - 间距略微缩小 */
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }
        
        .item {
            background: rgba(12, 20, 35, 0.85);
            backdrop-filter: blur(8px);
            border-radius: 20px;
            padding: 16px 8px;
            text-align: center;
            text-decoration: none;
            transition: all 0.15s cubic-bezier(0.2, 0.9, 0.6, 1.2);
            border: 1px solid rgba(255, 200, 100, 0.3);
            position: relative;
            overflow: hidden;
            cursor: pointer;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255,255,255,0.05);
        }
        
        .item .icon {
            font-size: 32px;
            margin-bottom: 8px;
            display: inline-block;
            transition: all 0.1s;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }
        
        .item .name {
            font-size: 13px;
            font-weight: 700;
            color: #f0f3fa;
            letter-spacing: 0.5px;
            font-family: monospace;
        }
        
        /* 机械扫描特效 */
        .item::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 215, 0, 0.12), transparent);
            transform: skewX(-20deg);
            transition: left 0.4s;
            pointer-events: none;
        }
        
        .item:hover::after {
            left: 120%;
        }
        
        .item:hover {
            transform: translateY(-4px) scale(1.01);
            background: rgba(30, 48, 80, 0.95);
            border-color: #ffaa44;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5), 0 0 5px rgba(255, 200, 0, 0.5);
        }
        
        .item:active {
            transform: scale(0.97);
        }
        
        .item:hover .icon {
            transform: scale(1.05);
            filter: drop-shadow(0 0 6px #ffaa44);
        }
        
        /* 分类标题 - 字体缩小 */
        .cate {
            font-size: 14px;
            font-weight: 700;
            color: #ffdd99;
            margin-bottom: 14px;
            padding-left: 10px;
            position: relative;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.5px;
            font-family: monospace;
            text-shadow: 0 1px 1px black;
        }
        
        .cate::before {
            content: "⚙️";
            font-size: 14px;
            filter: drop-shadow(0 0 2px orange);
        }
        
        .cate-game::before { content: "🎮"; font-size: 14px; }
        .cate-tool::before { content: "🔧"; font-size: 14px; }
        .cate-puzzle::before { content: "🧠"; font-size: 14px; }
        
        /* 页面切换 */
        .page {
            display: none;
        }
        
        .page.active {
            display: block;
            animation: gearEngage 0.28s ease-out;
        }
        
        @keyframes gearEngage {
            0% {
                opacity: 0;
                transform: translateY(6px) scale(0.99);
                filter: blur(1px);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: blur(0);
            }
        }
        
        /* 提示文字 - 字体缩小 */
        .click-hint {
            text-align: center;
            margin-top: 20px;
            font-size: 10px;
            color: #b9ad70;
            background: rgba(0, 0, 0, 0.6);
            display: inline-block;
            width: auto;
            padding: 4px 14px;
            border-radius: 30px;
            backdrop-filter: blur(4px);
            letter-spacing: 0.6px;
            border: 1px solid #ffaa3355;
            font-family: monospace;
            pointer-events: none;
        }
        
        .footer-bar {
            display: flex;
            justify-content: center;
            margin-top: 22px;
        }
        
        /* 机械装饰齿轮 */
        .gear-deco {
            position: absolute;
            opacity: 0.18;
            font-size: 22px;
            pointer-events: none;
            animation: spinSlow 20s linear infinite;
        }
        @keyframes spinSlow {
            0% { transform: rotate(0deg);}
            100% { transform: rotate(360deg);}
        }
    </style>
</head>
<body>

<script>
    // ======================= 机械质感音效系统 =======================
    class MechanicalSFX {
        constructor() {
            this.audioCtx = null;
            this.enabled = true;
            this.initAudio();
        }
        
        initAudio() {
            try {
                this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            } catch(e) {
                console.warn("Web Audio not supported");
                this.enabled = false;
            }
        }
        
        ensureContext() {
            if (!this.audioCtx) {
                this.initAudio();
            }
            if (this.audioCtx && this.audioCtx.state === 'suspended') {
                this.audioCtx.resume().catch(e=>{});
            }
        }
        
        // 清脆机械按键声
        playClick() {
            if (!this.enabled) return;
            this.ensureContext();
            if (!this.audioCtx) return;
            const now = this.audioCtx.currentTime;
            const osc = this.audioCtx.createOscillator();
            const gain = this.audioCtx.createGain();
            osc.connect(gain);
            gain.connect(this.audioCtx.destination);
            osc.type = 'square';
            osc.frequency.value = 880;
            gain.gain.value = 0.18;
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.12);
            osc.start();
            osc.stop(now + 0.1);
            const osc2 = this.audioCtx.createOscillator();
            const gain2 = this.audioCtx.createGain();
            osc2.connect(gain2);
            gain2.connect(this.audioCtx.destination);
            osc2.type = 'triangle';
            osc2.frequency.value = 440;
            gain2.gain.value = 0.06;
            gain2.gain.exponentialRampToValueAtTime(0.0001, now + 0.08);
            osc2.start();
            osc2.stop(now + 0.08);
        }
        
        // 切换音效（沉重机械拨档）
        playSwitch() {
            if (!this.enabled) return;
            this.ensureContext();
            if (!this.audioCtx) return;
            const now = this.audioCtx.currentTime;
            const osc = this.audioCtx.createOscillator();
            const gain = this.audioCtx.createGain();
            osc.connect(gain);
            gain.connect(this.audioCtx.destination);
            osc.type = 'sawtooth';
            osc.frequency.value = 620;
            gain.gain.value = 0.16;
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.18);
            osc.start();
            osc.stop(now + 0.16);
            const oscLow = this.audioCtx.createOscillator();
            const gainLow = this.audioCtx.createGain();
            oscLow.connect(gainLow);
            gainLow.connect(this.audioCtx.destination);
            oscLow.type = 'sine';
            oscLow.frequency.value = 180;
            gainLow.gain.value = 0.08;
            gainLow.gain.exponentialRampToValueAtTime(0.0001, now + 0.1);
            oscLow.start();
            oscLow.stop(now + 0.1);
        }
        
        // 金属碰撞
        playHeavyClick() {
            if (!this.enabled) return;
            this.ensureContext();
            if (!this.audioCtx) return;
            const now = this.audioCtx.currentTime;
            const osc = this.audioCtx.createOscillator();
            const gain = this.audioCtx.createGain();
            osc.connect(gain);
            gain.connect(this.audioCtx.destination);
            osc.type = 'square';
            osc.frequency.value = 520;
            gain.gain.value = 0.22;
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.1);
            osc.start();
            osc.stop(now + 0.09);
            const bufferSize = 4096;
            const noiseNode = this.audioCtx.createScriptProcessor(bufferSize, 1, 1);
            noiseNode.onaudioprocess = function(e) {
                const output = e.outputBuffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    output[i] = (Math.random() - 0.5) * 0.06;
                }
                noiseNode.disconnect();
            };
            noiseNode.connect(this.audioCtx.destination);
            setTimeout(() => {
                if(noiseNode) noiseNode.disconnect();
            }, 50);
        }
    }
    
    const mechSFX = new MechanicalSFX();
    
    function enableAudioOnFirstTouch() {
        if (mechSFX.audioCtx && mechSFX.audioCtx.state === 'suspended') {
            mechSFX.audioCtx.resume();
        }
        document.removeEventListener('touchstart', enableAudioOnFirstTouch);
        document.removeEventListener('click', enableAudioOnFirstTouch);
    }
    document.addEventListener('touchstart', enableAudioOnFirstTouch);
    document.addEventListener('click', enableAudioOnFirstTouch);
    
    // ========== 手动切换核心 ==========
    function switchToTab(tabId, playSwitchSound = true) {
        if (playSwitchSound) {
            mechSFX.playSwitch();
        }
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById('p'+tabId).classList.add('active');
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelector(`.tab[data-tab="${tabId}"]`).classList.add('active');
        if (navigator.vibrate) navigator.vibrate(10);
    }
    
    function getCurrentTab() {
        if(document.getElementById('p1').classList.contains('active')) return 1;
        if(document.getElementById('p2').classList.contains('active')) return 2;
        if(document.getElementById('p3').classList.contains('active')) return 3;
        return 1;
    }
    
    function nextTabManually() {
        let cur = getCurrentTab();
        let nxt = cur === 3 ? 1 : cur + 1;
        switchToTab(nxt, true);
    }
    
    // 重新绑定选项卡事件 (避免重复，使用全新克隆)
    const tabGroup = document.querySelector('.tab-group');
    const oldTabs = document.querySelectorAll('.tab');
    oldTabs.forEach(tab => {
        const newTab = tab.cloneNode(true);
        tab.parentNode.replaceChild(newTab, tab);
        newTab.addEventListener('click', (e) => {
            e.stopPropagation();
            const num = parseInt(newTab.getAttribute('data-tab'), 10);
            mechSFX.playClick();
            switchToTab(num, false);
        });
    });
    
    // 标题点击切换
    const titleHeader = document.querySelector('.header');
    if(titleHeader) {
        titleHeader.addEventListener('click', (e) => {
            e.stopPropagation();
            mechSFX.playHeavyClick();
            nextTabManually();
            const h1 = document.querySelector('.header h1');
            if(h1) {
                h1.style.transform = 'scale(1.02)';
                setTimeout(() => { if(h1) h1.style.transform = ''; }, 100);
            }
        });
    }
    
    // 副标题点击
    const subP = document.querySelector('.header p');
    if(subP) {
        subP.style.cursor = 'pointer';
        subP.addEventListener('click', (e) => {
            e.stopPropagation();
            mechSFX.playClick();
            nextTabManually();
        });
    }
    
    // 所有卡片点击播放金属碰撞
    const allCards = document.querySelectorAll('.item');
    allCards.forEach(card => {
        card.addEventListener('click', (e) => {
            mechSFX.playHeavyClick();
            if(navigator.vibrate) navigator.vibrate(15);
            // 涟漪效果
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const ripple = document.createElement('span');
            ripple.style.position = 'absolute';
            ripple.style.borderRadius = '50%';
            ripple.style.backgroundColor = 'rgba(255,200,100,0.5)';
            ripple.style.width = '0px';
            ripple.style.height = '0px';
            ripple.style.left = x + 'px';
            ripple.style.top = y + 'px';
            ripple.style.transform = 'translate(-50%, -50%)';
            ripple.style.pointerEvents = 'none';
            ripple.style.transition = 'width 0.25s, height 0.25s, opacity 0.3s';
            card.style.position = 'relative';
            card.style.overflow = 'hidden';
            card.appendChild(ripple);
            setTimeout(() => {
                ripple.style.width = '140px';
                ripple.style.height = '140px';
                ripple.style.opacity = '0';
            }, 10);
            setTimeout(() => ripple.remove(), 300);
        });
    });
    
    // 清除任何可能的自动轮询
    (function killAutoTimers() {
        let maxId = setTimeout(() => {}, 0);
        for(let i=0;i<maxId;i++) {
            clearInterval(i);
            clearTimeout(i);
        }
        if(window._autoTimer) clearInterval(window._autoTimer);
    })();
    
    window.addEventListener('load', () => {
        if(!document.querySelector('.page.active')) {
            document.getElementById('p1').classList.add('active');
